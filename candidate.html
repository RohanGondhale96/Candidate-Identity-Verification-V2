<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate Reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{--blue:#0076FB;--blue-d:#185FA5;--ink:#2A2A2A;--muted:#5A6473;--soft:#8A93A3;--line:#E5E9F0;--bg:#F7F8FA}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans','Helvetica Neue',sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
  button{font-family:inherit}
  .nav{height:46px;background:#0B0D12;color:#fff;display:flex;align-items:center;padding:0 20px;font-size:16px;font-weight:700}
  .accent{height:3px;background:linear-gradient(90deg,#ED1750,#8724CE,#0076FB,#12B76A,#F59E0B)}
  .ph{background:#fff;border-bottom:1px solid #E0E0E0;padding:12px 20px;display:flex;align-items:center;gap:14px}
  .ph .back{width:32px;height:32px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .ph h1{margin:0;font-size:18px;font-weight:600;line-height:1.25}
  .ph .sub{font-size:12.5px;color:#747474}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,30,50,.06),0 8px 22px rgba(20,30,50,.08)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .g{background:#E7F4EC;color:#1A7A3A}.r{background:#FDECEC;color:#B42318}.a{background:#FBF1DE;color:#8A6414}.n{background:#ECEEF1;color:#5A6473}.b{background:#EAF2FE;color:#185FA5}
  .btn{height:36px;border-radius:6px;padding:0 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .btn.sec{background:#fff;border:1px solid #DCE2EB;color:var(--ink)}
  .btn.pri{background:var(--blue);border:1px solid var(--blue);color:#fff}
  .icb{width:34px;height:34px;border:1px solid #DCE2EB;border-radius:6px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
  .av{border-radius:50%;object-fit:cover;flex-shrink:0;background:#EFEFEF}
  .kv{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:14px 20px}
  .kv .k{font-size:12px;color:#747474}.kv .v{font-size:13.5px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ricon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
  .ricon svg{width:18px;height:18px}
  .ri-id{background:#EAF2FE;color:#185FA5}.ri-auto{background:#F1ECFB;color:#6B3FC4}.ri-imp{background:#E7F4EC;color:#1A7A3A}.ri-sh{background:#FDEDF1;color:#C0174A}
  .rtitle{font-size:14px;font-weight:600}.rmeta{font-size:12.5px;color:#747474;margin-top:2px}
  a.lnk{color:var(--blue);font-weight:600;text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:5px}
  a.lnk:hover{text-decoration:underline}

  /* A: split view */
  .split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start}
  .prof{padding:18px}
  .prof .top{display:flex;gap:14px;align-items:center;margin-bottom:16px}
  .prof h2{margin:0;font-size:18px;font-weight:700}
  .rlist{margin-top:18px;padding:14px 10px 10px}
  .rlist .lbl{padding:0 8px 8px}
  .rrow{display:flex;gap:12px;align-items:flex-start;padding:11px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .rrow:hover{background:#F7F8FA}
  .rrow.sel{background:#EFF6FF;border-color:#BFDBFE}
  .rrow .rr{margin-left:auto;align-self:center}
  .viewer{padding:0;overflow:hidden}
  .vh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .vh .t{flex:1;min-width:0}
  .vb{padding:20px;background:#F3F5F8}
  .repwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:300px}
  .repwrap iframe{display:block;width:100%;height:300px;border:0;opacity:0;transition:opacity .2s}
  .repwrap.ready iframe{opacity:1}
  .repwrap .repload{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:13px}
  .repwrap.ready .repload{display:none}
  .doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px 30px;max-width:720px;margin:0 auto}
  .doc .dh{display:flex;justify-content:space-between;border-bottom:1.5px solid #1A1A1A;padding-bottom:8px;margin-bottom:16px}
  .doc .verd{display:flex;align-items:center;gap:10px;background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .cmp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .cmp .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .ph2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ph2 div{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:#EFEFEF}
  .ph2 img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
  .ph2 span{position:absolute;left:0;right:0;bottom:0;padding:12px 8px 5px;background:linear-gradient(to top,rgba(0,0,0,.62),transparent);color:#fff;font-size:11px;font-weight:600}

  @media(max-width:900px){
    .split{grid-template-columns:1fr}
  }
</style>
</head>

function ext(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M21 14v7H3V3h7"/></svg>'; }
function dl(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>'; }
function ricon(r){ return '<span class="ricon ri-'+r.k+'">'+ICON[r.k]+'</span>'; }
function avatar(n){ return '<img class="av" src="'+IMG[0]+'" alt="" width="'+n+'" height="'+n+'" style="width:'+n+'px;height:'+n+'px">'; }
function kv(cols){ return '<div class="kv" style="--cols:'+cols+'">'+
  [['Email',P.email],['Phone',P.phone],['Joined',P.joined],['Location',P.loc],['Recruiter',P.recruiter],['Source',P.source]]
  .map(function(x){ return '<div><div class="k">'+x[0]+'</div><div class="v" title="'+x[1]+'">'+x[1]+'</div></div>'; }).join('')+'</div>'; }

/* ---------- split view: profile + report list on the left, selected report on the right ---------- */
/* The joining-day report on the right IS the finalized report: the prototype renders it in its
   report-only view (verify-identity.html?reportOnly=<id>), the same document as Download / Activity. */
var selA = 0, REPORT_SRC = 'index.html?reportOnly=c1';
function placeholder(r){
  var msg = r.k==='auto' ? 'The automated identity check report is being designed next.' : 'Sample of this report to come.';
  return '<div style="height:260px;border:1.5px dashed #DCE2EB;border-radius:10px;background:#fff;display:grid;place-items:center;text-align:center;color:var(--soft);font-size:13px;padding:20px">'+
    '<div><div style="font-weight:600;color:#5A6473;margin-bottom:4px">'+r.t+'</div>'+msg+'</div></div>';
}
function viewerHead(r){
  return '<div class="t"><div class="rtitle">'+r.t+'</div><div class="rmeta">'+r.ctx+' · '+r.date+' · '+r.by+'</div></div>'+
    '<button class="btn sec" onclick="downloadSel()"'+(r.k==='id'?'':' disabled style="opacity:.5;cursor:not-allowed"')+'>'+dl()+'Download</button>';
}
function listHtml(){
  return R.map(function(x,i){ return '<div class="rrow'+(i===selA?' sel':'')+'" onclick="selectReport('+i+')">'+
    '<div style="min-width:0"><div class="rtitle">'+x.t+'</div><div class="rmeta">'+x.ctx+' · '+x.date.split(',')[0]+'</div></div><span class="rr"><span class="pill '+x.res[1]+'">'+x.res[0]+'</span></span></div>'; }).join('');
}
function optA(){
  var r = R[selA];
  return '<div class="split">'+
    '<div>'+
      '<div class="card prof"><div class="top">'+avatar(56)+'<div style="min-width:0"><h2>'+P.name+'</h2><div class="rmeta">'+P.rhid+' · '+P.role+'</div><div style="margin-top:6px"><span class="pill b">'+P.stage+'</span></div></div></div>'+kv(2)+'</div>'+
      '<div class="card rlist"><div class="lbl">Reports ('+R.length+')</div><div id="rl">'+listHtml()+'</div></div>'+
    '</div>'+
    '<div class="card viewer">'+
      '<div class="vh" id="vh">'+viewerHead(r)+'</div>'+
      '<div class="vb">'+
        '<div id="repwrap" class="repwrap"><div class="repload">Loading report…</div><iframe id="repframe" title="Joining-day identity check report" scrolling="no" src="'+REPORT_SRC+'" onload="fitFrame()"></iframe></div>'+
        '<div id="ph" style="display:none"></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}
/* the report keeps loaded; switching reports only swaps what is shown */
function selectReport(i){
  selA=i; var r=R[i];
  document.getElementById('rl').innerHTML=listHtml();
  document.getElementById('vh').innerHTML=viewerHead(r);
  var isId=r.k==='id';
  document.getElementById('repwrap').style.display=isId?'block':'none';
  var ph=document.getElementById('ph'); ph.style.display=isId?'none':'block'; ph.innerHTML=isId?'':placeholder(r);
}
function fitFrame(){
  var f=document.getElementById('repframe'); if(!f) return;
  try{ var d=f.contentDocument; f.style.height=(Math.ceil(d.documentElement.getBoundingClientRect().height)+2)+'px'; f.parentNode.classList.add('ready'); }catch(e){ f.style.height='1600px'; }
}
function downloadSel(){ if(R[selA].k!=='id') return; var f=document.getElementById('repframe'); try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} }
window.addEventListener('resize', function(){ fitFrame(); });

function draw(){ document.getElementById('root').innerHTML='<div class="wrap">'+optA()+'</div>'; }
draw();
</script>
</body>
</html>
